<!-- ============================= -->
<!-- ABC LEVELS CONTAINER -->
<!-- Main level selection screen -->
<!-- ============================= -->

<div class="abc-levels">


  <!-- ============================= -->
  <!-- PAGE TITLE -->
  <!-- ============================= -->

  <h2 class="title">

    Select Level

  </h2>


  <!-- ============================= -->
  <!-- LEVELS GRID -->
  <!-- Holds all level buttons -->
  <!-- ============================= -->

  <div class="levels-grid">


    <!-- ============================= -->
    <!-- LEVEL 1 -->
    <!-- Unlocked level -->
    <!-- ============================= -->

    <div class="level unlocked" (click)="startLevel(1)">

      <span>1</span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 2 -->
    <!-- Unlocked level -->
    <!-- ============================= -->

    <div class="level unlocked" (click)="startLevel(2)">

      <span>2</span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 3 -->
    <!-- Unlocked level -->
    <!-- ============================= -->

    <div class="level unlocked" (click)="startLevel(3)">

      <span>3</span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 4 -->
    <!-- Unlocked level -->
    <!-- ============================= -->

    <div class="level unlocked" (click)="startLevel(4)">

      <span>4</span>

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVELS -->
    <!-- Future levels -->
    <!-- ============================= -->

    <div class="level locked">🔒</div>

    <div class="level locked">🔒</div>

    <div class="level locked">🔒</div>


  </div>

</div>
