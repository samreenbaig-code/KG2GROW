<!-- ============================= -->
<!-- MEMORY GAME CONTAINER -->
<!-- Main memory match section -->
<!-- ============================= -->

<div class="memory-container">


  <!-- ============================= -->
  <!-- PAGE TITLE -->
  <!-- Memory game heading -->
  <!-- ============================= -->

  <h2 class="title">

    Memory Match

  </h2>


  <!-- ============================= -->
  <!-- CARD GRID -->
  <!-- Contains all memory levels -->
  <!-- ============================= -->

  <div class="card-grid">


    <!-- ============================= -->
    <!-- LEVEL 1 -->
    <!-- Animal memory game -->
    <!-- ============================= -->

    <div class="card" (click)="goToLevel(1)">

      <div class="icon">🐶</div>

      <p>Animal Memory</p>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 2 -->
    <!-- Fruit memory game -->
    <!-- ============================= -->

    <div class="card" (click)="goToLevel(2)">

      <div class="icon">🍎</div>

      <p>Fruit Memory</p>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 3 -->
    <!-- Shape memory game -->
    <!-- ============================= -->

    <div class="card" (click)="goToLevel(3)">

      <div class="icon">🔷</div>

      <p>Shape Memory</p>

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVEL -->
    <!-- Future game level -->
    <!-- ============================= -->

    <div class="card locked">

      <div class="icon">🔒</div>

      <p>Locked</p>

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVEL -->
    <!-- Future game level -->
    <!-- ============================= -->

    <div class="card locked">

      <div class="icon">🔒</div>

      <p>Locked</p>

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVEL -->
    <!-- Future game level -->
    <!-- ============================= -->

    <div class="card locked">

      <div class="icon">🔒</div>

      <p>Locked</p>

    </div>

  </div>

</div>
