<!-- ============================= -->
<!-- NUMBER LEVELS CONTAINER -->
<!-- Main number game section -->
<!-- ============================= -->

<div class="number-levels">


  <!-- ============================= -->
  <!-- PAGE TITLE -->
  <!-- Number game heading -->
  <!-- ============================= -->

  <h2 class="title">

    Select Level

  </h2>


  <!-- ============================= -->
  <!-- LEVEL GRID -->
  <!-- Contains all number levels -->
  <!-- ============================= -->

  <div class="levels-grid">


    <!-- ============================= -->
    <!-- LEVEL 1 -->
    <!-- Learn numbers activity -->
    <!-- ============================= -->

    <div
      class="level unlocked"

      (click)="startLevel(1)">

      <span>

        Learn Numbers

      </span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 2 -->
    <!-- Count objects activity -->
    <!-- ============================= -->

    <div
      class="level unlocked"

      (click)="startLevel(2)">

      <span>

        Count Objects

      </span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 3 -->
    <!-- Simple math activity -->
    <!-- ============================= -->

    <div
      class="level unlocked"

      (click)="startLevel(3)">

      <span>

        Simple Math

      </span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 4 -->
    <!-- Number tracing activity -->
    <!-- ============================= -->

    <div
      class="level unlocked"

      (click)="startLevel(4)">

      <span>

        Number Tracing

      </span>

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVEL -->
    <!-- Future game level -->
    <!-- ============================= -->

    <div class="level locked">

      🔒

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVEL -->
    <!-- Future game level -->
    <!-- ============================= -->

    <div class="level locked">

      🔒

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVEL -->
    <!-- Future game level -->
    <!-- ============================= -->

    <div class="level locked">

      🔒

    </div>

  </div>

</div>
