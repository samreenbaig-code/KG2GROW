<!-- ============================= -->
<!-- PUZZLE CONTAINER -->
<!-- Main puzzle level section -->
<!-- ============================= -->

<div class="puzzle-container">


  <!-- ============================= -->
  <!-- PAGE TITLE -->
  <!-- Puzzle game heading -->
  <!-- ============================= -->

  <h1 class="title">

    Puzzle Party

  </h1>


  <!-- ============================= -->
  <!-- LEVEL GRID -->
  <!-- Contains all puzzle levels -->
  <!-- ============================= -->

  <div class="level-grid">


    <!-- ============================= -->
    <!-- LEVEL 1 -->
    <!-- Animal puzzle level -->
    <!-- ============================= -->

    <div
      class="level active"

      (click)="goToLevel(1)">

      1

      <br>

      <span>

        Animal

      </span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 2 -->
    <!-- Shape puzzle level -->
    <!-- ============================= -->

    <div
      class="level active"

      (click)="goToLevel(2)">

      2

      <br>

      <span>

        Shape

      </span>

    </div>


    <!-- ============================= -->
    <!-- LEVEL 3 -->
    <!-- Alphabet puzzle level -->
    <!-- ============================= -->

    <div
      class="level active"

      (click)="goToLevel(3)">

      3

      <br>

      <span>

        Alphabet

      </span>

    </div>


    <!-- ============================= -->
    <!-- LOCKED LEVELS -->
    <!-- Future puzzle levels -->
    <!-- ============================= -->

    <div class="level locked">

      🔒

    </div>


    <div class="level locked">

      🔒

    </div>


    <div class="level locked">

      🔒

    </div>

  </div>

</div>
